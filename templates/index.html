{% extends 'base.html' %}
{% block content %}
<style>
.hero {
  background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("{{ url_for('static', filename='images/kitchen-wallpaper.png') }}");
  background-size: cover; background-position: center; height: 500px;
  border-radius: 24px; display:flex; align-items:center; justify-content:center; text-align:center; color:white;
}
.best-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}
@media (max-width: 768px) {
  .best-grid { grid-template-columns: repeat(2, 1fr); }
}
.best-item {
  background: #f8f9fa;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}
</style>

<div class="hero mb-5">
  <div>
    <h1 class="fw-bold" style="font-size:3rem; text-shadow:0 4px 12px rgba(0,0,0,0.7);">Welcome to Mancao's Kitchen! 🍲</h1>
    <p>Cook with Love by Edmon</p>
    <a href="{{ url_for('order') }}" class="btn btn-success btn-lg mt-3 px-5 fw-bold">Order Now</a>
  </div>
</div>

<div class="p-4 bg-white rounded-4 shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">🔥 Our Best Sellers</h4>
    <a href="{{ url_for('order') }}" class="btn btn-sm btn-outline-success">View Menu</a>
  </div>

  <div class="best-grid">
    <div class="best-item">
      <h5>🍖 Adobo</h5>
      <small class="text-muted">₱120</small>
    </div>
    <div class="best-item">
      <h5>🍲 Bulalo</h5>
      <small class="text-muted">₱250</small>
    </div>
    <div class="best-item">
      <h5>🍜 Cabagan</h5>
      <small class="text-muted">₱150</small>
    </div>
    <div class="best-item">
      <h5>🍗 Tinola</h5>
      <small class="text-muted">₱180</small>
    </div>
  </div>
</div>

{% endblock %}
